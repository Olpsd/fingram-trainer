<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр по финграмотности</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Одна колонка: шапка со счётом → фильтры → карточка вопроса → разбор. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1b2430; --muted:#5d6672; --line:#d9ddd6;
  --accent:#0f6e5a; --accent-ink:#ffffff; --accent-soft:#e1f0eb;
  --ok:#1f7a3f; --ok-soft:#e3f3e8; --bad:#b3261e; --bad-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fff3d6;
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1b222a; --ink:#e7ebef; --muted:#9aa4af; --line:#2c3540;
  --accent:#3fb495; --accent-ink:#0b1915; --accent-soft:#173a31;
  --ok:#5cc97f; --ok-soft:#173022; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f2c14e; --warn-soft:#3a2f12; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1b222a; --ink:#e7ebef; --muted:#9aa4af; --line:#2c3540;
  --accent:#3fb495; --accent-ink:#0b1915; --accent-soft:#173a31;
  --ok:#5cc97f; --ok-soft:#173022; --bad:#ff8a80; --bad-soft:#3a1d1b; --warn:#f2c14e; --warn-soft:#3a2f12; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:700 22px/1.2 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.stats{display:flex;gap:8px;font-variant-numeric:tabular-nums}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center;min-width:72px}
.stat b{display:block;font:600 18px/1.2 var(--body)}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:hover{border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;font-weight:600}
.kind{border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.q{font:600 18px/1.45 var(--body);white-space:pre-line;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:15px/1.4 var(--body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font:600 12px var(--body);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.opt:disabled{cursor:default}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow select,input[type=number]{width:100%;font:15px var(--body);padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.mrow.right select{border-color:var(--ok);background:var(--ok-soft)}
.mrow.wrong select{border-color:var(--bad);background:var(--bad-soft)}
.mrow .fix{grid-column:2;font-size:13px;color:var(--ok)}
@media (max-width:520px){.mrow{grid-template-columns:1fr}.mrow .fix{grid-column:1}}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 18px;font:600 15px var(--body);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.verdict{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.verdict.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.verdict.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.verdict.neutral{background:var(--accent-soft);border-left:4px solid var(--accent)}
.verdict h3{margin:0;font:600 16px var(--body)}
.verdict .ans b{font-weight:600}
.flag{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
.end{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.big{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums}
.wronglist{text-align:left;width:100%;display:flex;flex-direction:column;gap:6px;font-size:14px}
.wronglist div{border-top:1px solid var(--line);padding-top:6px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Тренажёр по финансовой грамотности</h1><div class="sub">143 вопроса из зачётных заданий, в случайном порядке</div></div>
    <div class="stats">
      <div class="stat"><b id="sDone">0/0</b><span>пройдено</span></div>
      <div class="stat ok"><b id="sOk">0</b><span>верно</span></div>
      <div class="stat bad"><b id="sBad">0</b><span>ошибки</span></div>
    </div>
  </header>
  <div class="bar"><i id="bar"></i></div>
  <div class="filters" id="filters" role="group" aria-label="Тема"></div>
  <main class="card" id="card"></main>
  <div class="hint">Клавиши: 1–9 выбирают вариант, Enter проверяет ответ и переходит дальше.</div>
</div>
<script>
const Q=[{"id": "Дох1", "t": "Доходы и расходы. Налоги", "n": "1", "q": "Что из перечисленного ниже НЕ является доходом физического лица?", "ty": "single", "a": "изменение рыночной стоимости квартиры, которая не продаётся", "w": "Доход возникает только при реальном получении денег; рост цены без продажи – это не доход.", "f": "", "o_": ["заработная плата", "сумма, полученная от продажи квартиры", "изменение рыночной стоимости квартиры, которая находится в собственности лица и не продаётся", "сумма процентов по вкладам в банке"], "c": [2]}, {"id": "Дох2", "t": "Доходы и расходы. Налоги", "n": "2", "q": "Какие из перечисленных действий положительно скажутся на величине денежных средств в текущем месяце? (неск ответов)", "ty": "multi", "a": "получение кредита; получение заработной платы", "w": "Сертификат на маткапитал – не наличные деньги, страховая премия – расход, вычет по декларации придёт позже.", "f": "", "o_": ["получение сертификата на материнский капитал", "получение кредита", "получение заработной платы", "оплата страховой премии", "оформление налоговой декларации налогового вычета за лечение"], "c": [1, 2]}, {"id": "Дох3", "t": "Доходы и расходы. Налоги", "n": "3", "q": "Какие обязательные платежи из заработной платы работника обязан делать работодатель, если тот работает по трудовому договору или договору ГПХ?", "ty": "multi", "a": "НДФЛ от 13 %; страховые взносы от 30 %", "w": "НДС и НПД к зарплате не относятся. Работодатель удерживает НДФЛ как налоговый агент и платит взносы за свой счёт.", "f": "", "o_": ["НДФЛ от 13%", "страховые взносы от 30%", "на добавленную стоимость 22%", "налог на профессиональный доход 6%"], "c": [0, 1]}, {"id": "Дох4", "t": "Доходы и расходы. Налоги", "n": "4", "q": "Что не поможет избавиться гражданину от хронического дефицита бюджета?", "ty": "single", "a": "получить кредит", "w": "Кредит покрывает дефицит лишь временно и увеличивает будущие расходы (проценты).", "f": "", "o_": ["получить кредит", "начать экономить на проезде сла\n(напр-р, 8).", "ty": "input", "a": "6", "w": "Берём самые дешёвые: 200 + 200 + 300 + 400 + 500 + 650 = 2 250 руб.; седьмой (свитер 1 000) уже не помещается.", "f": "", "num": 6}, {"id": "Дох11", "t": "Доходы и расходы. Налоги", "n": "11", "q": "Алексей нашёл рубашки по цене 45 долл. за штуку. Алексей хотел бы приобрести 4 рубашки. Стоимость пересылки рубашек составляет 20 долл. Курс валюты составляет 60,00 руб. за один доллар. В торговом центре аналогичные рубашки стоят 3250 руб. Приведите расчеты и сделайте вывод, выгодна ли покупка через сайт.", "ty": "single", "a": "Да, выгодна", "w": "Сайт: (4 × 45 + 20) × 60 = 200 × 60 = 12 000 руб. Магазин: 4 × 3 250 = 13 000 руб. Экономия 1 000 руб.", "f": "", "o_": ["Да, выгодна", "Нет, не выгодна", "Цена одинаковая"], "c": [0]}, {"id": "Дох12", "t": "Доходы и расходы. Налоги", "n": "12", "q": "Пособие по временной нетрудоспособности рассчитывается исходя из:", "ty": "single", "a": "средней зарплаты за предыдущие два календарных года, ограниченной максимальным значением, и страхового стажа", "w": "Количество прежних больничных на размер пособия не влияет.", "f": "", "o_": ["средней зарплаты сотрудника за предыдущие два календарных года, ограниченной максимальным значением, страхового стажа работы сотрудника и количества ранее использованных больничных за два предыдущих года", "средней зарплаты сотрудника за два выбранных года, ограниченной максимальным значением, и страхового стажа работы сотрудника", "средней зарплаты сотрудника за предыдущие два календарных года, ограниченной максимальным значением, и страхового стажа работы сотрудника", "исходя из средней зарплаты сотрудника за предыдущий календарный год, ограниченной максимальным значением, и страхового стажа работы сотрудника"], "c": [2]}, {"id": "Дох13", "t": "Доходы и расходы. Налоги", "n": "13", "q": "Если гражданину задержали зарплату больше, чем на 15 дней, он имеете право", "ty": "single", "a": "не выйти на работу, предварительно уведомив об этом работодателя ": "", "f": "", "o_": ["не может быть перенесен на последующие периоды", "может быть перенесен только на один последующий год", "может быть перенесен на последующие годы до полного его использования"], "c": [2]}, {"id": "Дох23", "t": "Доходы и расходы. Налоги", "n": "23", "q": "Если в налоговом периоде социальный налоговый вычет в связи с лечением, обучением не был использован полностью, то его остаток", "ty": "single", "a": "не может быть перенесён на последующие периоды", "w": "Социальный вычет «сгорает» в конце года.", "f": "", "o_": ["не может быть перенесен на последующие периоды", "может быть перенесен только на один последующий год", "может быть перенесен на последующие годы до полного его использования"], "c": [0]}, {"id": "Дох24", "t": "Доходы и расходы. Налоги", "n": "24", "q": "Продан жилой дом, находившийся в собственности 4 г. 5 мес. Фиксированная сумма имущественного налогового вычета составляет:", "ty": "single", "a": "1 млн руб.", "w": "Срок владения меньше минимального, налог платится; вычет по жилью – 1 млн руб.", "f": "", "o_": ["2 млн. руб", "1,5 млн. руб", "1 млн. руб", "250 тыс. руб"], "c": [2]}, {"id": "Дох25", "t": "Доходы и расходы. Налоги", "n": "25", "q": "Стандартный налоговый вычет на детей предоставляется до месяца, в котором доход, исчисленный нарастающим итогом с начала года, превысил ___ руб. (указать сумму).", "ty": "input", "a": "450 000 руб.", "w": "Лимит действует с 2025 года (до этого – 350 000 руб.).", "f": "", "num": 450000}, {"id": "Дох26", "t": "Доходы и расходы. Налоги", "n": "26", "q": "Фиксированная сумма имущественного налогового вычета при продаже автомобиля составляет:", "ty": "single", "a": "250 тыс. руб.", "w": "Для прочего имущества (не жильё и не земля) вычет – 250 000 руб.", "f": "", "o_": ["2 млн. руб", "1,5 млн. руб", "1 млн. руб", "250 тыс. руб"], "c": [3]}, {"id": "Дох27", "t": "Доходы и расходы. Налоги", "n": "27", "q": "Налоговую декларацию не обязан представлять в налоговый орган гражданин:", "ty": "single", "a": "претендующий на социальные вычеты за обучение, лечение", "w": "Подавать декларацию на вычет – право, а не обязанность. Дача в подарок не от близкого родственника и продажа авто при владении менее 3 лет – обязательное декларирование.", "f": "", "o_": ["получивший выигрыши в лотерею свыше 4 тыс. руб. до 15 тыс. руб", "получивший в подарок дачу от двоюродной сестры", "продавший автомобиль за 600 тыс. руб. (владение 7 мес.)", "претендующий на социальные вычеты за обучение, лечение"], "c": [3]}, {"id": "Дох28", "t": "Доходы и расходы. Налоги", "n": "28", "q": "Система ставок по НДФЛ:", "ty": "single", "a": "прогрессивная", "w": "С 2025 года действует пятиступенчатая шкала 13/15/18/20/22 %. В старых ключах может стоять «пропорциональная» – это было до 2021 года.", "f": "⚠", "o_": ["пропорциональная", "прогрессивная", "равная", "регрессивная"], "c": [1]}, {"id": "Дох29", "t": "Доходы и расходы. Налоги", "n": "29", "q": "Перечислите факторы (не менее трех), от которых зависит ставка НДФЛ.", "ty": "open", "a": "1) вид дохода (зарплата, дивиденды, проценты по вкладам, выигрыши, продажа имущества); 2) размер годового дохода (прогрессивная шкала: 13 % до 2,4 млн, далее 15/18/20/22 %); 3) налоговый статус (резидент или нерезидент – для нерезидентов 30 %); 4) категория налогоплательщика (например, отдельная шкала для районных коэффициентов и северных надбавок)", "w": "", "f": ""}, {"id": "Дох30", "t": "Доходы и расходы. Налоги", "n": "30", "q": "Какие из следующих утверждений являются верными?", "ty": "multi", "a": "150 тысяч рублей – максимальная сумма социального вычета; если имущество принадлежало более 5 лет, налог при продаже платить не придётся; социальный вычет можно получить при оплате очного обучения брата или сестры до 24 лет", "w": "Неверно: имущественный вычет при покупке жилья даётся не «2 раза в жизни», а один раз в пределах 2 млн руб. (остаток можно перенести на другие объекты).", "f": "", "o_": ["150 тысяч рублей – максимальная сумма социального налогового вычета", "если имущество принадлежало физлицу более 5 лет, налог на доход, полученный при его продаже, платить не придётся", "право на налоговый вычет имеет каждый гражданин при приобретении жилья, но не более 2 раз в жизни", "социальный налоговый вычет можно получить при оплате очного обучения брата или сестры в возрасте до 24 лет"], "c": [0, 1, 3]}, {"id": "Дох31", "t": "Доходы и расходы. Налоги", "n": "31", "q": "Если по каждому виду полученных налогоплательщиком доходов установлены различные ставки, то налоговая база определяется:", "ty": "single", "a": "по каждому виду доходов отдельно", "w": "П. 2 ст. 210 НК РФ.", "f": "", "o_": ["по максимальной ставке", "по средней ставке", "по каждому виду доходов отдельно", "по минимальной ставке"], "c": [2]}, {"id": "Дох32", "t": "Доходы и расходы. Налоги", "n": "32", "q": "Поведенческая модель принятия решений (с психологическими и социальными составляющими). Расставьте этапы по порядку.", "ty": "match", "a": "1 → 4 → 3 → 2", "w": "Человек опирается на самые разные данные (1) → собирает не всю информацию (4) → ограниченно её обрабатывает (3) → поведение отклоняется от плана (2).", "f": "", "l": ["Шаг 1", "Шаг 2", "Шаг 3", "Шаг 4"], "r": ["Человек опирается на самые разные данные; на восприятие влияют культура, эмоции и контекст", "Человек собирает не всю информацию, часто решает по одному значимому фактору", "Способности человека обрабатывать информацию и выбирать лучшее решение ограничены", "Поведение отклоняется от намеченного плана из-за поведенческих ошибок"]}, {"id": "Дох33", "t": "Доходы и расходы. Налоги", "n": "33", "q": "Простая (классическая) модель принятия решений, где человек полностью рационален. Расставьте этапы по порядку.", "ty": "match", "a": "3 → 1 → 4 → 2", "w": "Изучает только экономические данные (3) → собирает всю информацию (1) → полностью её обрабатывает и выбирает лучшее (4) → действует строго по решению (2).", "f": "", "l": ["Шаг 1", "Шаг 2", "Шаг 3", "Шаг 4"], "r": ["Принимая решения, человек лачивается", "при работе по трудовому договору работнику предоставляется больше социальных гарантий, чем по договору ГПХ"], "c": [0, 3]}, {"id": "Дох36", "t": "Доходы и расходы. Налоги", "n": "36", "q": "Что можно отнести к отличительным чертам налоговых платежей?", "ty": "multi", "a": "используются государством для выполнения общих задач и функций; уплачиваются из доходов физических и юридических лиц; обязательный, безвозмездный, денежный платёж", "w": "«Условие совершения юридически значимых действий» – признак сбора (госпошлины), а не налога.", "f": "", "o_": ["уплачиваются только из доходов юридических лиц", "используются государством для выполнения своих общих задач и функций", "является условием совершения юридически значимых действий в пользу плательщика", "уплачиваются из доходов физических и юридических лиц", "обязательный, безвозмездный, денежный платеж", "обязательный, безвозмездный, денежный и неденежный платеж"], "c": [1, 3, 4]}, {"id": "Фин1", "t": "Финансовое планирование и бюджет", "n": "1", "q": "Какую сумму имеет смысл откладывать на «финансовою подушку безопасности»?", "ty": "single", "a": "в размере дохода за шесть месяцев", "w": "Рекомендуемый резерв – 3–6 месячных доходов (расходов).", "f": "", "o_": ["при низком доходе можно не откладывать", "в размере годового дохода", "в размере дохода за шесть месяцев", "в размере месячного дохода"], "c": [2]}, {"id": "Фин2", "t": "Финансовое планирование и бюджет", "n": "2", "q": "Ведение личного бюджета позволяет:", "ty": "single", "a": "верно всё перечисленное", "w": "", "f": "", "o_": ["повышать свою финансовую дисциплину", "получать достоверную информацию о своих доходах и расходах", "ставить перед собой финансовые цели и достигать их", "верно все перечисленное"], "c": [3]}, {"id": "Фин3", "t": "Финансовое планирование и бюджет", "n": "3", "q": "К признакам финансовой цели не относится:", "ty": "single", "a": "приоритетность", "w": "Финансовая цель должна быть конкретной, иметь стоимость и срок.", "f": "", "o_": ["стоимость", "срок", "конкретность", "приоритетность"], "c": [3]}, {"id": "Фин4", "t": "Финансовое планирование и бюджет", "n": "4", "q": "Дефицит семейного бюджета наблюдается когда:", "ty": "single", "a": "расходы превышают доходы", "w": "", "f": "", "o_": ["сбережения превышают расходы", "расходы превышают доходы", "расходы превышают сбережения", "доходы превышают расходы"], "c": [1]}, {"id": "Фин5", "t": "Финансовое планирование и бюджет", "n": "5", "q": "Следует ли при ведении личного бюджета отражать полученные вами займы и кредиты в статье «доходы»?", "ty": "single", "a": "нет. Ведь мне же придётся их отдавать", "w": "Кредит – это долг, а не доход; поступление учитывают отдельно, как заёмные средства.", "f": "", "o_": ["нет. Мой доход - зарплата, а эти деньги я не заработал", "нет. Ведь мне же придется их отдавать", "да. Ведь на эти деньги я что-то покупаю, и если их не учесть, как доходы, у меня не сведется бюджет", "да. Но только если я не вернул заем в том же месяце, когда и взял в долг"], "c": [1]}, {"id": "Фин6", "t": "Финансовое планирование и бюджет", "n": "6", "q": "Сергей и Иван только что переехали из регионов в столицу, получив предложения о работе. Сергей нашел съемную квартиру за 50 000 руб. месяц. Иван взял ипотеку на 15 лет, ежемесячный платеж 40 000 руб. Что верно в этой ситуации:", "ty": "single", "a": "Иван берёт на себя дополнительный риск: в случае потери дохода он может не справиться с погашением кредита", "w": "", "f": "", "o_": ["Иван берет на себя дополнительный риск: в случае потери дохода он может столкнуться с проблемой невозможности погашения кредита", "решение Сергея относится к краткосрочному планированию, а Ивана - к долгосрочному", "из двух вариантов решений проблемы, действия Ивана являются единственно верными, так как его ежемесячный платеж оказался меньше", "из двух вариантов решений проблемы, действия Сергея являются единственно верными, так как он не переплачивает % по кредиту, а значит, не тратит деньги напрасно"], "c": [0]}, {"id": "Фин7", "t": "Финансовое планирование и бюджет", "n": "7", "q": "Соотнесите событие и период жизни (в среднем по России).", "ty": "match", "a": "окончание школы – 16–18 лет; образование после школы – 17–25 лет; вступление в брак – 24–27 лет; рождение ребёнка – 25–34 года; выход на пенсию – 60–65 лет", "w": "", "f": "", "l": ["окончание школы", "получение образования после школы", "вступление в брак", "рождение ребёнка", "выход на пенсию"], "r": ["16–18 лет", "17–25 лет", "24–27 лет", "25–34 года", "60–65 лет"]}, {"id": "Фин8", "t": "Финансовое планирование и бюджет", "n": "8", "q": "Соотнесите вид обязательства и ваши действия при взятии такого обязательства.", "ty": "match", "a": "аренда квартиры – рассчитать нагрузку на бюджет и горизонт планирования; абонемент в спортзал – убедиться в минимальной цене и соответствии потребностям; ипотека – подумать о подушке безопасности или застраховать жизнь и здоровье", "w": "", "f": "", "l": ["аренда квартиры", "месячный абонемент в спортзал", "ипотечный кредит"], "r": ["рассчитать нагрузку на бюджет и определиться с горизонтом планирования", "убедиться, что покупка делается по минимальной цене и удовлетворяет потребности", "заранее подумать о подушке безопасности или застраховать жизнь и здоровье"]}, {"id": "Фин9", "t": "Финансовое планирование и бюджет", "n": "9", "q": "Что из перечисленного является правильным поведением во время экономического кризиса?", "ty": "single", "a": "трата части накоплений на покупку товаров длительного пользования", "w": "В кризис цены и курс растут, поэтому нужные дорогие вещи выгоднее купить заранее за свои деньги; брать кредиты, продавать жильё и начинать бизнес рискованно. Вариант с ответом в разных ключах может отличаться.", "f": "⚠", "o_": ["продажа недвижимости", "начало нового бизнеса", "покупка автомобиля в кредит", "трата части накоплений на покупку товаров длительного пользования", "покупка недвижимости за счёт собственных средств", "преждевременный выход на пенсию"], "c": [3]}, {"id": "Фин10", "t": "Финансовое планирование и бюджет", "n": "10", "q": "Гражданин закрывает открытый год назад депозит (процентная ставка 9,5 % годовых без капитализации). Согласно данным государственных органов, индекс потребительских цен за год составил 111 %. Это значит, что, сняв деньги со счета, вы сможете купить товаров и услуг:", "ty": "single", "a": "меньше, чем могли бы купить на эти деньги год назад", "w": "Реальная доходность отрицательная: 9,5 % < 11 %.", "f": "", "o_": ["больше, чем могли бы купить на эти деньги год назад", "меньше, чем могли бы купить на эти деньги год назад", "столько же, сколько могли бы купить на эти деньги год назад", "не хватает данных для ответа"], "c": [1]}, {"id": "Сбе1", "t": "Сбережения и платежи", "n": "1", "q": "Чем безналичные расчеты могут быть удобнее наличных? Отметьте все однозначно правильные варианты:", "ty": "multi", "a": "быстрота совершения операций; наличие отметок, подтверждающих осуществление платежа", "w": "Комиссии бывают; анонимности у безналичных платежей нет.", "f": "", "o_": ["отсутствие комиссий", "быстрота совершения операций", "анонимность и конфиденциальность", "наличие отметок, подтверждающих осуществление платежа"], "c": [1, 3]}, {"id": "Сбе2", "t": "Сбережения и платежи", "n": "2", "q": "Какая банковская операция может быть недоступна в банкомате?", "ty": "single", "a": "оформить операцию с иностранной валютой", "w": "Внесение наличных, погашение кредита, оплата ЖКУ и СМС-информирование доступны в большинстве банкоматов.", "f": "", "o_": ["зачислить наличные средства на банковский счёт", "оформить операцию с иностранной валютой", "погасить задолженность по кредиту", "оплатить жилищно-коммунальные услуги", "подключить смс-оповещение"], "c": [1]}, {"id": "Сбе3", "t": "Сбережения и платежи", "n": "3", "q": "Подберите к способу расчёта подходящую ситуацию.", "ty": "match", "a": "эскроу – покупка квартиры на вторичном рынке (безнал); наличные – покупка хлеба на ярмарке; дебетовая ка ретаемую в ипотеку квартиру заемщик должен получить разрешение на это у банка"], "c": [1, 3]}, {"id": "Бан16", "t": "Банковская система. Кредиты и займы", "n": "16", "q": "Если при погашении кредита возникли финансовые проблемы, заемщик должен:", "ty": "single", "a": "встретиться с кредитным менеджером банка и обсудить изменение договора", "w": "Можно также просить кредитные каникулы или реструктуризацию.", "f": "", "o_": ["встретиться с кредитным менеджером банка и обсудить внесение изменений в кредитный договор", "подать в суд заявление о прекращении действия кредитного договора", "не предпринимать никаких действий до момента официального уведомления банка о необходимости погасить долг", "уведомить банк в письменном виде о невозможности оплаты ссуды в полном объеме и продолжать перечислять платежи в посильных для себя суммах"], "c": [0]}, {"id": "Бан17", "t": "Банковская система. Кредиты и займы", "n": "17", "q": "Что такое льготный период по кредитной карте?", "ty": "single", "a": "период, когда банк не начисляет проценты при условии возврата суммы, потраченной в отчётном периоде", "w": "", "f": "", "o_": ["период, в течение которого банк не взимает комиссию за пользование кредитной картой", "период, в течение которого начисляются проценты на денежные средства, использованные при оплате товаров и услуг кредитной картой", "период, в течение которого банк не начисляет проценты на задолженность при условии возврата суммы, использованной в течение отчетного периода", "период, в течение которого начисленный процент можно выплатить на льготных условиях"], "c": [2]}, {"id": "Бан18", "t": "Банковская система. Кредиты и займы", "n": "18", "q": "В каком случае целесообразнее отказаться от кредита?", "ty": "single", "a": "если ежемесячные платежи превышают 30–40 % доходов", "w": "", "f": "", "o_": ["если ежемесячные платежи по кредиту превышают 5-10% от доходов", "если у потенциального заёмщика нет кредитной истории", "если ежемесячные платежи по кредиту превышают 30-40% от доходов", "если ежемесячные платежи по кредиту превышают 15-20% от доходов"], "c": [2]}, {"id": "Бан19", "t": "Банковская система. Кредиты и займы", "n": "19", "q": "Какая информация о заёмщике хранится в бюро кредитных историй?", "ty": "multi", "a": "сведения о просроченной задолженности; положительная информация об исполнении обязательств; личные данные заёмщика", "w": "", "f": "", "o_": ["сведения о просроченной задолженности клиента банка", "положительная информация об исполнении кредитных обязательств заёмщика", "нет правильного ответа", "личные данные заёмщика"], "c": [0, 1, 3]}, {"id": "Бан20", "t": "Банковская система. Кредиты и займы", "n": "20", "q": "Недобросовестное отношение к возврату долга может обернуться для вас следующими неприятными последствиями:", "ty": "multi", "a": "невозможность оформить кредит из-за плохой кредитной истории; банк может продать долг коллекторам; временный запрет на выезд за границу", "w": "Всю зарплату забрать не могут – максимум 50 %. Порог для запрета выезда сейчас – 30 тыс. руб. (10 тыс. – для алиментов и ряда долгов).", "f": "⚠", "o_": ["работодатель будет обязан перечислять всю вашу зарплату кредитору для оплаты долга", "невозможностью оформить кредит тогда, когда он вам действительно будет нужен, — из-за плохой кредитной истории", "банк может продать ваш долг коллекторскому агентству", "временным запретом на выезд за границу - при наличии исполнительного документа по задолженности в размере более 10 тыс. рублей"], "c": [1, 2, 3]}, {"id": "Бан21", "t": "Банковская система. Кредиты и займы", "n": "21", "q": "С какой целью Банк России может снижать ключевую ставку?", "ty": "single", "a": "чтобы «оживить» экономику страны", "w": "Снижение ставки удешевляет кредиты и стимулирует спрос.", "f": "", "o_": ["чтобы снизить инфляцию", "чтобы «оживить» экономику страны", "чтобы защитить экономику от «перегрева»", "чтобы укрепить курс валюты"], "c": [1]}, {"id": "Бан28", "t": "Банковская система. Кредиты и займы", "n": "28", "q": "Какие из следующих операций приведут к дополнительному доходу банка?", "ty": "multi", "a": "банк рефинансировал кредит, выданный в другом банке; банк выдал деньги в кредит физлицу", "w": "", "f": "", "o_": ["физическое лицо перевело деньги из этого банка в другой для погашения там кредита", "банк рефинансировал кредит физического лица, выданный в другом банке", "банк рефинансировал клиенту кредит, взятый в этом банке, под более низкую процентную ставку", "банк выдал деньги в кредит физическому лицу", "физическое лицо погасило в банке свой кредит"], "c": [1, 3]}, {"id": "Бан29", "t": "Банковская система. Кредиты и займы", "n": "29", "q": "Аннуитетный платёж — это:", "ty": "single", "a": "равный ежемесячный платёж, включающий основной долг и проценты", "w": "", "f": "", "o_": ["равный ежемесячный платеж, включающий платежи основной суммы и процента", "сокращающийся ежемесячный платеж, при котором основная сумма погашается равными частями, а процент начисляется на остаток задолженности", "платеж, зависимый от ставки рефинансирования Центрального банка", "платеж, увеличивающийся по мере выплаты кредита"], "c": [0]}, {"id": "Бан30", "t": "Банковская система. Кредиты и займы", "n": "30", "q": "Ваша подруга хочет купить автомобиль в кредит. В банке она узнала, что обязательным условием кредита является полное страхование автомобиля от ущерба и угона (КАСКО). Почему банк выдвигает такое условие?", "ty": "single", "a": "автомобиль является залогом: если он будет утерян, банк ничего не потеряет, так как получит страховую сумму", "w": "", "f": "", "o_": ["В данном случае страховая компания является поручителем по кредиту. Если подруга не сможет погасить кредит, страховая компания возместит банку потери", "Автомобиль является залогом. Если он будет утерян, подруге не будет смысла платить по кредиту, но банк ничего не потеряет, так как получит страховую сумму", "Банк заботится о безмятежной жизни вашей подруги", "Автомобиль является залогом. Если автомобиль будет застрахован, то подруга будет больше бояться его потерять, а значит, с большей вероятностью погасит кредит вовремя"], "c": [1]}, {"id": "Бан31", "t": "Банковская система. Кредиты и займы", "n": "31", "q": "Условие кредита «10 000 рублей под 10%» означает, что:", "ty": "single", "a": "в формулировке не хватает данных", "w": "Не указаны срок и порядок начисления процентов.", "f": "", "o_": ["в формулировке вопроса не хватает данных", "через год вы должны будете вернуть 11 000 рублей", "первоначальный взнос по кредиту 1 000 рублей"], "c": [0]}, {"id": "Бан32", "t": "Банковская система. Кредиты и займы", "n": "32", "q": "У вас есть несколько кредитов, по которым возможно досрочное погашение. Вы неожиданно получили премию, которую можно пустить на погашение кредитов. Какой кредит вы будете гасить в первую очередь?", "ty": "single", "a": "самый дорогой (с самой высокой ставкой)", "w": "", "f": "", "o_": ["самый дорогой (с самой высокой процентной ставкой), потому что это сильнее всего уменьшит переплату по кредитам и сэкономит больше всего расходов в будущем", "самый большой, потому что его трудно погасить, и если появилась возможность его уменьшить, надо этим пользоваться", "самый долгосрочный, потому что хочется сократить общий срок «жизни в кредит» и почувствовать себя свободным человеком", "самый маленький, потому что это легче всего сделать, и еще останутся деньги на что-нибудь приятное и полезное"], "c": [0]}, {"id": "Бан33", "t": "Банковская система. Кредиты и займы", "n": "33", "q": "Андрей пришел в банк, чтобы взять кредит. В банке ему дали договор, и сказали, что его необходимо подписать, чтобы можно было взять кредит, но Андрей ничего не понял из текста договора и подписывать не стал. Он спросил, может ли он взять договор домой, чтобы внимательно его прочитать. Банк отказал ему в этом. Является ли это решение банка правомерным?", "ty": "single", "a": "Нет, любой клиент имеет право взять договор домой", "w": "Закон о потребкредите: индивидуальные условия можно изучить, банк обязан их предоставить.", "f": "", "o_": ["Нет, любой клиент банка имеет право взять договор домой, ваши права как потребителя нарушены", "а, договор нельзя забирать домой, так как он является конфиденциальным нормативным документом", "Нет, любое желание клиента банк обязан удовлетворять", "Да, договор нельзя забрать домой, но можно пригласить своих друзей или членов семьи в банк, чтобы прочитать его вместе с ними"], "c": [0]}, {"id": "Инв1", "t": "Инвестиции", "n": "1", "q": "Какая из приведённых ниже операций относится к инвестиционным?", "ty": "single", "a": "открытие обезличенного металлического счёта", "w": "", "f": "", "o_": ["получение в наследство золотого слитка", "приобретение золотого кольца", "получение в подарок золотых часов", "открытие обезличенного металлического счёта"], "c": [3]}, {"id": "Инв2", "t": "Инвестиции", "n": "2", "q": "Может ли инвестор, размещая средства на инвестиционном счете быть уверенным в возврате ему всей суммы вложений?", "ty": "single", "a": "нет, поскольку вложения в ценные бумаги могут привести к убыткам", "w": "АСВ инвестиции не страхует, ИИС тоже не гарантирует доход.", "f": "", "o_": ["да, поскольку средства на инвестиционных счетах застрахованы Агентством по страхованию вкладов", "да, если это индивидуальный инвестиционный счет", "да, т.к. дивиденды и купонные платежи по ценным бумагам поступают на этот счет", "нет, поскольку вложения в ценные бумаги могут привести к убыткам"], "c": [3]}, {"id": "Инв3", "t": "Инвестиции", "n": "3", "q": "Что из перечисленного не может входить в портфель инвестиций?", "ty": "single", "a": "кредит", "w": "", "f": "", "o_": ["депозит", "ценные бумаги", "паи паевых инвестиционных фондов", "кредит"], "c": [3]}, {"id": "Инв4", "t": "Инвестиции", "n": "4", "q": "Юлия приобрела 50 облигаций, рыночная стоимость которых составляет 1400 руб. за одну облигацию, хотя номинальная стоимость облигаций составляет 1800 руб. Срок погашения облигаций наступит через 12 месяцев. Купонных выплат условия размещения облигаций не предполагают. В момент погашения облигаций Юлия получит доход", "ty": "single", "a": "приобретения с дисконтом", "w": "При погашении Юлия получит номинал: (1 800 − 1 400) × 50 = 20 000 руб.", "f": "", "o_": ["за счёт того, что облигации были приобретены с дисконтом", "за счёт того, что по облигациям выплачиваются дивиденды", "обладание данным видом облигаций не принесёт Юлии дохода", "за счёт распределения прибыли, которую получит компания-эмитент"], "c": [0]}, {"id": "Инв5", "t": "Инвестиции", "n": "5", "q": "Расположите финансовые инструменты по возрастанию риска.", "ty": "match", "a": "банковский вклад → корпоративные облигации → привилегированные акции → обыкновенные акции", "w": "", "f": "", "l": ["1 – наименьший риск", "2", "3", "4 – наибольший риск"], "r": ["банковский вклад", "корпоративные облигации", "привилегированные акции", "обыкновенные акции"]}, {"id": "Инв6", "t": "Инвестиции", "n": "6", "q": "Чем хороши «голубые фишки» (так называют акции некоторых крупных компаний, например, Сбербанк, Лукойл, Газпром, Яндекс и т.д.)?", "ty": "single", "a": "высокой ликвидностью и устойчивостью к потрясениям", "w": "", "f": "", "o_": ["они приносят очень высокий доход", "они обладают высокой ликвидностью и более устойчивы к экономическим потрясениям по сравнению с другими акциями на рынке", "их цены движутся в направлении, обратном всему остальному рынку", "они дают право голоса на собрании акционеров"], "c": [1]}, {"id": "Инв7", "t": "Инвестиции", "n": "7", "q": "Под диверсификацией понимается:", "ty": "single", "a": "распределение инвестиций между несколькими активами", "w": "", "f": "", "o_": ["управление валютным риском", "формирование инвестиционного портфеля", "выявление недооценённых акций", "распределение инвестиций между несколькими активами"], "c": [3]}, {"id": "Инв8", "t": "Инвестиции", "n": "8", "q": "Какие из перечисленных ценных бумаг, как правило, дают право на получение фиксированного дохода и вложенных средств по истечении определенно ховой суммы", "страхового возмещения", "страховой премии", "страхового ущерба"], "c": [1]}, {"id": "Стр23", "t": "Страхование", "n": "23", "q": "По видам обязательного страхования страховой тариф устанавливается:", "ty": "single", "a": "законодательством страны", "w": "", "f": "", "o_": ["законодательством страны", "общим для всех видов страхования", "по согласованию сторон договора страхования", "в зависимости от вида страхования"], "c": [0]}, {"id": "Стр24", "t": "Страхование", "n": "24", "q": "Договор страхования вступает в силу с момента:", "ty": "single", "a": "оплаты первого страхового взноса", "w": "Ст. 957 ГК РФ, если договором не предусмотрено иное.", "f": "", "o_": ["подписания", "оплаты первого страхового взноса", "уплаты всей страховой премии"], "c": [1]}, {"id": "Стр25", "t": "Страхование", "n": "25", "q": "Стоимость имущества, зафиксированная в договоре имущественного страхования, именуется:", "ty": "single", "a": "действительная (страховая стоимость)", "w": "", "f": "", "o_": ["оценочная", "восстановительная", "действительная", "первоначальная", "остаточная"], "c": [2]}, {"id": "Стр26", "t": "Страхование", "n": "26", "q": "Страховым случаем по обязательному страхованию банковских вкладов признается:", "ty": "single", "a": "отзыв у банка лицензии на осуществление банковских операций", "w": "Второй страховой случай – мораторий ЦБ на удовлетворение требований кредиторов.", "f": "", "o_": ["потеря физическим лицом трудоспособности", "отзыв у банка лицензии на осуществление банковских операций", "введение моратория на удовлетворение требований аудиторов", "все ответы верны"], "c": [1]}, {"id": "Стр27", "t": "Страхование", "n": "27", "q": "Возмещение по вкладам в банке, в отношении которых наступил страховой случай, выплачивается в размере:", "ty": "single", "a": "100 %, не более 1 400 тыс. руб.", "w": "Для отдельных случаев (продажа жилья, наследство и др.) – до 10 млн руб.; для безотзывных сберегательных сертификатов и долгосрочных вкладов – до 2,8 млн руб.", "f": "", "o_": ["100% не более 1000 тыс. руб", "100% не более 1400 тыс. руб", "100% не более 2000 тыс. руб", "100% не более 2500 тыс. руб"], "c": [1]}];
const TOPICS=[...new Set(Q.map(q=>q.t))];
const SHORT={"Доходы и расходы. Налоги":"Налоги","Финансовое планирование и бюджет":"Бюджет","Сбережения и платежи":"Сбережения","Банковская система. Кредиты и займы":"Кредиты","Инвестиции":"Инвестиции","Страхование":"Страхование"};
const KIND={single:"один ответ",multi:"несколько ответов",match:"соотнесите",input:"введите число",open:"открытый вопрос"};
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let wrongSet=new Set(store.get("fg_wrong",[]));
let topic=null, onlyWrong=false, deck=[], pos=0, ok=0, bad=0, wrongNow=[], state=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderFilters(){
  const f=$("filters");f.innerHTML="";
  const mk=(label,pressed,fn)=>{const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=label;b.setAttribute("aria-pressed",pressed);b.onclick=fn;f.appendChild(b)};
  mk("Все темы",!topic&&!onlyWrong,()=>{topic=null;onlyWrong=false;start()});
  TOPICS.forEach(t=>mk(SHORT[t]||t,topic===t&&!onlyWrong,()=>{topic=t;onlyWrong=false;start()}));
  mk(`Мои ошибки (${wrongSet.size})`,onlyWrong,()=>{if(!wrongSet.size)return;onlyWrong=true;topic=null;start()});
}
function start(){
  let pool=Q.filter(q=>(!topic||q.t===topic)&&(!onlyWrong||wrongSet.has(q.id)));
  deck=shuffle(pool);pos=0;ok=0;bad=0;wrongNow=[];renderFilters();show();
}
function stats(){
  $("sDone").textContent=`${Math.min(pos+(state&&state.done?1:0),deck.length)}/${deck.length}`;
  $("sOk").textContent=ok;$("sBad").textContent=bad;
  $("bar").style.width=(deck.length?100*(pos+(state&&state.done?1:0))/deck.length:0)+"%";
}
function show(){
  const c=$("card");
  if(pos>=deck.length)return finish();
  const q=deck[pos];state={q,done:false,sel:new Set()};
  let h=`<div class="meta"><span class="tag">${esc(SHORT[q.t]||q.t)}</span><span>№ ${esc(q.n)} в файле</span><span class="kind">${KIND[q.ty]}</span></div><p class="q">${esc(q.q)}</p>`;
  const RES=`<div id="res"></div>`;
  if(q.ty==="single"||q.ty==="multi"){
    const pin=i=>/все перечисл|ни один|нет верного|нет правильного|не хватает данных|все ответы верны|^[IV, и]+$|^Только II$/i.test(q.o_[i]);
    state.order=shuffle(q.o_.map((_,i)=>i).filter(i=>!pin(i))).concat(q.o_.map((_,i)=>i).filter(pin));
    h+=`<div class="opts" id="opts">`+state.order.map((oi,k)=>`<button type="button" class="opt" data-i="${oi}" id="opt${k}"><span class="k">${k+1}</span><span>${esc(q.o_[oi])}</span></button>`).join("")+`</div>`;
  }else if(q.ty==="match"){
    state.rord=shuffle(q.r.map((_,i)=>i));
    h+=`<div id="match">`+q.l.map((l,i)=>`<div class="mrow" id="mr${i}"><label for="ms${i}">${esc(l)}</label><select id="ms${i}"><option value="">— выберите —</option>${state.rord.map(ri=>`<option value="${ri}">${esc(q.r[ri])}</option>`).join("")}</select></div>`).join("")+`</div>`;
  }else if(q.ty==="input"){
    h+=`<input type="number" id="num" inputmode="numeric" placeholder="Ответ числом">`;
  }
  h+=RES+`<div class="actions" id="act">`+(q.ty==="single"?`<span class="hint">Нажмите на вариант, ответ проверится сразу</span>`:q.ty==="open"?`<button class="btn" id="go">Показать ответ</button>`:`<button class="btn" id="go">Проверить</button>`)+`<button class="btn ghost" id="skip" type="button">Пропустить</button></div>`;
  c.innerHTML=h;
  c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i,b));
  if($("go"))$("go").onclick=check;
  $("skip").onclick=()=>{wrongNow.push(q);pos++;show()};
  if($("num"))$("num").focus();
  stats();
}
function pick(i,b){
  if(state.done)return;const q=state.q;
  if(q.ty==="single"){state.sel=new Set([i]);check();return}
  state.sel.has(i)?state.sel.delete(i):state.sel.add(i);b.classList.toggle("sel");
}
function correctText(q){
  if(q.ty==="single"||q.ty==="multi")return q.c.map(i=>q.o_[i]).join("; ");
  if(q.ty==="match")return q.l.map((l,i)=>`${l} → ${q.r[i]}`).join("\n");
  if(q.ty==="input")return String(q.num).replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return q.a;
}
function check(){
  const q=state.q;if(state.done){next();return}
  let right;
  if(q.ty==="single"||q.ty==="multi"){
    if(!state.sel.size)return;
    right=q.c.length===state.sel.size&&q.c.every(i=>state.sel.has(i));
    document.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.remove("sel");
      if(q.c.includes(i))b.classList.add(state.sel.has(i)?"right":"missed");else if(state.sel.has(i))b.classList.add("wrong")});
  }else if(q.ty==="match"){
    const vals=q.l.map((_,i)=>$("ms"+i).value);if(vals.some(v=>v===""))return;
    right=true;q.l.forEach((_,i)=>{const r=$("mr"+i),good=+vals[i]===i;r.classList.add(good?"right":"wrong");$("ms"+i).disabled=true;
      if(!good){right=false;r.insertAdjacentHTML("beforeend",`<div class="fix">Верно: ${esc(q.r[i])}</div>`)}});
  }else if(q.ty==="input"){
    const v=$("num").value.replace(/\s/g,"");if(v==="")return;right=+v===q.num;$("num").disabled=true;
  }else{ // open
    state.done=true;
    $("res").innerHTML=`<div class="verdict neutral"><h3>Эталонный ответ</h3><div style="white-space:pre-line">${esc(q.a)}</div></div>`;
    $("act").innerHTML=`<span class="hint">Сравните со своим ответом:</span><button class="btn" id="y">Знал</button><button class="btn ghost" id="n">Не знал</button>`;
    $("y").onclick=()=>{ok++;wrongSet.delete(q.id);save();next()};$("n").onclick=()=>{bad++;wrongNow.push(q);wrongSet.add(q.id);save();next()};
    stats();return;
  }
  state.done=true;
  if(right){ok++;wrongSet.delete(q.id)}else{bad++;wrongNow.push(q);wrongSet.add(q.id)}
  save();
  const why=q.w?`<div>${esc(q.w)}</div>`:"";
  const flag=q.f?`<div class="flag">⚠ Ответ дан по закону 2026 года. В старом ключе преподавателя здесь может стоять другой вариант.</div>`:"";
  $("res").innerHTML=right
    ?`<div class="verdict ok"><h3>Верно</h3>${why?`<details><summary>Пояснение</summary>${why}</details>`:""}</div>${flag}`
    :`<div class="verdict bad"><h3>Неверно</h3><div class="ans">Правильный ответ: <b style="white-space:pre-line">${esc(correctText(q))}</b></div>${why}</div>${flag}`;
  $("act").innerHTML=`<button class="btn" id="nx">${pos+1<deck.length?"Следующий вопрос":"Посмотреть итог"}</button>`;
  $("nx").onclick=next;$("nx").focus();stats();
}
function save(){store.set("fg_wrong",[...wrongSet]);renderFilters();}
function next(){pos++;show()}
function finish(){
  stats();$("bar").style.width="100%";renderFilters();
  const pct=deck.length?Math.round(100*ok/deck.length):0;
  $("card").innerHTML=`<div class="end"><div class="hint">Раунд завершён</div><div class="big">${ok} из ${deck.length}</div><div>${pct} % правильных ответов</div>
  <div class="actions" style="justify-content:center">${wrongNow.length?`<button class="btn" id="rw">Повторить ошибки (${wrongNow.length})</button>`:""}<button class="btn ghost" id="again">Начать заново</button></div>
  ${wrongNow.length?`<div class="wronglist"><b>Где были ошибки:</b>${wrongNow.map(q=>`<div>${esc(q.q.split("\n")[0])}<br><span class="hint">Ответ: ${esc(correctText(q).replace(/\n/g,"; "))}</span></div>`).join("")}</div>`:""}</div>`;
  if($("rw"))$("rw").onclick=()=>{deck=shuffle(wrongNow);pos=0;ok=0;bad=0;wrongNow=[];show()};
  $("again").onclick=start;
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT")return;
  if(e.key==="Enter"){if(state&&state.done){e.preventDefault();next()}else if($("go")){e.preventDefault();check()}return}
  if(e.target.tagName==="INPUT")return;
  const n=+e.key;if(n>=1&&n<=9&&state&&!state.done){const b=$("opt"+(n-1));if(b)b.click()}
});
start();
</script>
</body>
</html>
